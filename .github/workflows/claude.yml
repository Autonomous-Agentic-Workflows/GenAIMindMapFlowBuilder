name: Claude Dispatch

# Claude Code integration:
#  - Mention @claude in issues, PR comments, or reviews to hand work to Claude
#  - Trigger manually via workflow_dispatch with a prompt
#  - Trigger programmatically from local agents via repository_dispatch (event_type: claude-task)
#    gh api repos/${{ github.repository }}/dispatches \
#      -f event_type=claude-task -f 'client_payload[prompt]=<task>'
# Requires repo/org secret: ANTHROPIC_API_KEY

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Task for Claude'
        required: true
        type: string
  repository_dispatch:
    types: [claude-task]

jobs:
  claude:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.prompt ||
                github.event_name == 'repository_dispatch' && github.event.client_payload.prompt || '' }}
          claude_args: '--max-turns 30'
