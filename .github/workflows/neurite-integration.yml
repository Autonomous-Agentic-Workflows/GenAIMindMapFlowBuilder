name: Neurite Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  integration:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements_minimal.txt
    
    - name: Test Neurite integration
      run: |
        python -c "from backend.neurite_client import NeuriteClient; print('✅ Neurite client imported')"
    
    - name: Verify all routers
      run: |
        python -c "from backend import app; print('✅ FastAPI app initialized')"
